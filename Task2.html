<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <h2>Student Registration Form</h2>
    <form>
      <label for="n">Name:</label><br />
      <input type="text" placeholder="Enter your name" id="n"/><br /><br />

      <label for="e">Email:</label><br />
      <input type="text" placeholder="Enter your Email" id="e" /><br /><br />

      <label for="m">Mobile Number:</label><br />
      <input type="text" placeholder="Enter your mobile no. " id="m" /><br /><br />

      <label for="c">Course:</label><br />
      <select id="c">
        <option>...</option>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>MAC</option>
        <option>B.SC</option></select
      ><br /><br />

      <label>Gender:</label><br />
      <input type="radio" name="g" />Male <input type="radio" name="g" />Female
      <input type="radio" name="g" />Other <br /><br />

      <input type="submit" value="submit" />
    </form>
  </body>
</html>
